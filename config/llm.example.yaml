# Kopyala: cp config/llm.example.yaml config/llm.yaml  (gerçek *.yaml git-ignore'lu)
#
# LLM YALNIZCA "neyi test edelim / sonuç ne demek" için akıl yürütür; ağa ASLA dokunmaz
# ve CONFIRMED kararını her zaman deterministik motor verir (bkz. CLAUDE.md §5).
# CLI flag'i bu dosyayı override eder: --llm ollama verilirse provider alanı yok sayılır.
llm:
  provider: ollama                 # none | ollama | gemini | anthropic
  model: qwen3.8:27b               # `ollama list`'teki TAM tag; hız için qwen2.5:14b-instruct, reasoning için qwen3.8:27b
  host: http://localhost:11434     # yalnızca ollama; Docker İÇİNDE koşarsan: http://host.docker.internal:11434
  temperature: 0                   # 0 = tekrar-üretilebilir öneri (önerilen)
  max_tokens: 2048
  # think: reasoning ("thinking") modelleri için (ör. qwen3.8) — varsayılan kapalı.
  #   Hipotez/enrich/aksiyon üretimi JSON ŞEMA (structured outputs) ile zorlandığından her iki modda da
  #   geçerli çıktı gelir; fark hız/kapsam: false → hızlı ve yeterli (önerilen),
  #   true → daha kapsamlı ama yavaş; bu durumda max_tokens'ı yükselt (düşünme bütçeyi yer).
  #   Kapalıyken model yine de <think> bloğu koyarsa parse öncesi sökülür (kemer+askı).
  think: false
