# Kopyala: cp config/actors.example.yaml config/actors.yaml
# GERÇEK parola/token buraya YAZILMAZ — .secrets/ altına koy, git-ignore'lu.
actors:
  - name: user_A
    role: user
    auth:
      type: token                       # token | storagestate
      login_url: "http://localhost:3000/rest/user/login"
      credentials: { email: "a@test.local", password: "REDACTED" }
      token_location: { kind: "bearer", from: "json:authentication.token" }
    own_object_ids: { basket: "1", basketitem: "1" }   # basket=login yanıtındaki bid; basketitem=sepete eklenen BasketItem.id

  - name: user_B
    role: user
    auth:
      type: storagestate                # elle login → export edilmiş Playwright state
      storagestate_path: "./.secrets/user_B.storagestate.json"
    own_object_ids: { basket: "2", basketitem: "2" }

  # OAuth/OIDC redirect'i veya JS-tabanlı SPA login formu olan hedefler için (storagestate'in
  # "elle login → export" adımını otomatikleştirir). Yalnızca TOTP MFA otomatikleşir — mfa_*
  # alanları yalnızca hedefte MFA VARSA gerekli; yoksa hepsini kaldır.
