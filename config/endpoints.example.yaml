# Stage 0: recon yok — test edilecek endpoint'leri elle ver.
# resource_key, actor.own_object_ids içindeki anahtarla eşleşmeli (baseline/positive control).
# NOT: path'ler gerçek Juice Shop route'larıyla doğrulanmıştır (`/api/baskets/{id}` yoktur —
# Sequelize REST kaydı `/rest/basket/{id}`dir, bkz. README "Demo — kanıtlı bulgu üret").
endpoints:
  - method: GET
    path_template: "/rest/basket/{id}"
    id_param: id
    id_location: path
    resource_key: basket

  - method: PUT
    path_template: "/api/BasketItems/{id}"
    id_param: id
    id_location: path
    resource_key: basketitem

  # Query-param enjeksiyon yüzeyi: Juice Shop'un /rest/products/search?q= uç noktası error-based
  # SQLi'ye açıktır (SQLITE_ERROR). injection oracle'ı q parametresinde SQLi/XSS'i yansıma+imza ile
  # kanıtlar. id_location=query olduğundan planner enjeksiyonu doğru yüzeye (query) yöneltir.
  - method: GET
    path_template: "/rest/products/search"
    id_param: q
    id_location: query
    resource_key: products
