# Sentinel-Agent CI — testler + Juice Shop'a karşı DAST taraması (SARIF → Security sekmesi).
#
# İki iş:
#   test : network'süz unit test süiti (her PR'da zorunlu kapı).
#   dast : OWASP Juice Shop'u ayağa kaldırır, iki hesap kaydeder, tarar; SARIF'i GitHub
#          code-scanning'e yükler → bulgular repo "Security" sekmesinde uyarı olarak görünür.
#
# Not: dast işi CI kapısını findings ile KIRMAZ (`--fail-on none`); yalnızca raporlar.
# Kendi hedefinizde bloklamak isterseniz `--fail-on high` yapıp `continue-on-error`'ı kaldırın.
name: sentinel

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # upload-sarif için gerekli
  pull-requests: write     # baseline-diff PR yorumu için gerekli (yalnızca aynı-repo PR'larında
                            # çalışır; fork PR'larında GITHUB_TOKEN salt-okunur olduğundan yorum
                            # adımı sessizce başarısız olur — SARIF/artefakt yine üretilir)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Bağımlılıklar
        run: pip install -e ".[dev]"
      - name: Playwright Chromium kur
        # BrowserAuthProvider testleri (tests/test_auth_browser.py) gerçek bir Chromium
        # ister — route interception ile ağa hiç çıkmaz, ama tarayıcı ikili dosyası gerekir.
        run: playwright install --with-deps chromium
      - name: Testler
        run: pytest -q

  # RK-10: 0-FP negatif-ikiz regresyon kapısı — hardened ikizde yanlış CONFIRMED çıkarsa kırmızı.
  # Ağsız (hedef gerektirmez); "FP hâlâ 0 mı?" sorusunu her PR'da belirlenimci yanıtlar.
  bench-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Bağımlılıklar
        run: pip install -e "."
      - name: 0-FP negatif-ikiz kapısı
        run: python -m scripts.bench_guard

      # AS-7: yer gerçeği etiketleri (benchmarks/) ve dedektör template'leri sessizce
      # değişmiş mi? Kasıtlı değişiklikten sonra `python -m scripts.verify_release --update`
      # çalıştırılıp manifest commit'lenmelidir. Ağsız, import'suz, yalnız stdlib.
      - name: Sürüm bütünlüğü (manifest + linkler)
        run: python -m scripts.verify_release

  dast:
    runs-on: ubuntu-latest
    needs: test
    services:
      juice-shop:
        # Sürüm SABİTLİ (benchmarks/juiceshop.expected.yaml AYNI sürüme göre kalibre edildi) —
        # imaj sessizce değişip beklenmeyen bulgu/false-negative üretmesin.
        image: bkimminich/juice-shop:v20.2.0
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      - name: Bağımlılıklar
        run: pip install -e "."

      - name: Juice Shop hazır olsun
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/rest/admin/application-version >/dev/null; then
              echo "juice-shop ayakta"; exit 0
            fi
            sleep 2
          done
          echo "juice-shop zamanında ayağa kalkmadı"; exit 1

      - name: İki test hesabı kaydet
        run: |
          reg() {
            curl -sf -X POST http://localhost:3000/api/Users \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"$1\",\"password\":\"$2\",\"passwordRepeat\":\"$2\",\"securityAnswer\":\"x\",\"securityQuestion\":{\"id\":1}}" \
              >/dev/null && echo "kayıt: $1"
          }
          reg sentinel_a@ci.local Pass-A-123! || true
          reg sentinel_b@ci.local Pass-B-123! || true

      - name: CI config üret
        run: |
          mkdir -p config
          cat > config/ci.scope.yaml <<'YAML'
          target:
            base_url: "http://localhost:3000"
          scope:
            allowed_hosts: ["localhost", "127.0.0.1"]
            allowed_ports: [3000]
            allowed_path_prefixes: ["/api/", "/rest/", "/"]
            denied_path_patterns: ["*/reset*", "*/admin/db*", "*/export*"]
            allowed_methods: ["GET", "HEAD"]
            destructive_tests: false
            external_network: false
          budget:
            max_total_requests: 800
            max_rps_per_host: 8
            max_wall_clock_sec: 300
            max_payload_bytes: 1048576
          privacy:
            no_secrets_in_query: true
          YAML

          cat > config/ci.actors.yaml <<'YAML'
          actors:
            - name: user_A
              role: user
              auth:
                type: token
                login_url: "http://localhost:3000/rest/user/login"
                credentials: { email: "sentinel_a@ci.local", password: "Pass-A-123!" }
                token_location: { kind: "bearer", from: "json:authentication.token" }
              own_object_ids: { basket: "1" }
            - name: user_B
              role: user
              auth:
                type: token
                login_url: "http://localhost:3000/rest/user/login"
                credentials: { email: "sentinel_b@ci.local", password: "Pass-B-123!" }
                token_location: { kind: "bearer", from: "json:authentication.token" }
              own_object_ids: { basket: "2" }
          YAML

          cat > config/ci.endpoints.yaml <<'YAML'
          endpoints:
            - method: GET
              path_template: "/rest/basket/{id}"
              id_param: id
              id_location: path
              resource_key: basket
          YAML

      - name: Baseline önbelleğini geri yükle
        # R-C1 (report/baseline.py): hedef dalın (PR'da base, push'ta kendi dalı) EN SON
        # taramasını "bilinen" tabana koyar. `key` kasıtlı asla eşleşmez (run_id benzersiz) —
        # asıl iş `restore-keys` ön-ek eşleşmesiyle o dala ait EN GÜNCEL cache'i bulmak.
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: runs/baseline/findings.json
          key: sentinel-baseline-${{ github.base_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            sentinel-baseline-${{ github.base_ref || github.ref_name }}-

      - name: Baseline var mı kontrol et
        id: baseline
        run: |
          if [ -f runs/baseline/findings.json ]; then
            echo "args=--baseline runs/baseline/findings.json" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Tarama (SARIF üret)
        continue-on-error: true
        run: |
          python -m scripts.run_scan \
            --scope config/ci.scope.yaml \
            --actors config/ci.actors.yaml \
            --endpoints config/ci.endpoints.yaml \
            --mode active --out runs/ \
            --sarif sentinel.sarif \
            --fail-on none \
            ${{ steps.baseline.outputs.args }}

      - name: SARIF'i code-scanning'e yükle
        if: always()
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: sentinel.sarif
          category: sentinel-agent

      - name: PR yorumu için Markdown üret
        # Yalnızca YENİ (baseline'da olmayan) CONFIRMED/LIKELY bulguları özetler — "no silent
        # drops" ilkesiyle uyumlu: hiçbir bulgu gizlenmez, yalnızca zaten bilinenler PR gürültüsü
        # yapmaz (bkz. report/baseline.py docstring).
        if: always() && github.event_name == 'pull_request'
        run: |
          FINDINGS=$(ls runs/run-*/findings.json 2>/dev/null | head -n1 || true)
          if [ -n "$FINDINGS" ]; then
            python scripts/pr_comment.py "$FINDINGS" -o pr_comment.md
          else
            printf '%s\n%s\n' '<!-- sentinel-agent-pr-comment -->' \
              'Sentinel-Agent taraması findings.json üretmedi (bkz. iş akışı logları).' \
              > pr_comment.md
          fi

      - name: PR'a yorum gönder/güncelle
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr_comment.md', 'utf8');
            const marker = '<!-- sentinel-agent-pr-comment -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }

      - name: Baseline'ı güncelle (yalnızca main/develop push'unda)
        if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: |
          FINDINGS=$(ls runs/run-*/findings.json 2>/dev/null | head -n1 || true)
          if [ -n "$FINDINGS" ]; then
            mkdir -p runs/baseline
            cp "$FINDINGS" runs/baseline/findings.json
          fi

      - name: Baseline önbelleğini kaydet
        if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: runs/baseline/findings.json
          key: sentinel-baseline-${{ github.ref_name }}-${{ github.run_id }}

      - name: Koşum çıktısını artefakt olarak sakla
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sentinel-run
          path: runs/
          if-no-files-found: ignore
