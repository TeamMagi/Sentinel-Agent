[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-agent"
version = "0.0.1"
description = "AI-assisted authenticated access-control pentest tool (IDOR/BOLA + BFLA)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "PyYAML>=6.0",
  "SQLModel>=0.0.21",
  "playwright>=1.47",
  "PyJWT>=2.8",
  "anthropic>=0.69",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "respx>=0.21"]
mcp = ["mcp>=2.0"]   # v1'de FastMCP idi; v2'de MCPServer'a taşındı (mcpserver.py bu API'yi kullanır)

[project.scripts]
sentinel = "pentestai.cli:main"
sentinel-mcp = "pentestai.mcpserver:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pentestai.webui" = ["assets/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
